services:
  postgres:
    image: postgres:17-alpine
    container_name: research-agent-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: getaways
      POSTGRES_DB: research_agent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d research_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
